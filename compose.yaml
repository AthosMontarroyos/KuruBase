name: kurubase

services:
  postgres:
    image: postgres:17.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KURUBASE_API_PASSWORD: ${KURUBASE_API_PASSWORD}
      KURUBASE_IDENTITY_ADMIN_PASSWORD: ${KURUBASE_IDENTITY_ADMIN_PASSWORD:?KURUBASE_IDENTITY_ADMIN_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/migrations/0001_foundation.sql:/docker-entrypoint-initdb.d/001_foundation.sql:ro
      - ./infra/postgres/migrations/0002_identity_authorization.sql:/docker-entrypoint-initdb.d/002_identity.sql:ro
      - ./infra/postgres/init/002_runtime_role.sql:/docker-entrypoint-initdb.d/003_runtime_role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - private
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: "${NODE_ENV:-development}"
      HOST: "${HOST:-0.0.0.0}"
      PORT: "${PORT:-8080}"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      DB_POOL_MAX: "${DB_POOL_MAX:-10}"
      DB_STATEMENT_TIMEOUT_MS: "${DB_STATEMENT_TIMEOUT_MS:-5000}"
      EXPOSED_SCHEMA: "${EXPOSED_SCHEMA:-api}"
      IDENTITY_PROVIDER: "${IDENTITY_PROVIDER:?IDENTITY_PROVIDER is required}"
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_AUDIENCE: "${OIDC_AUDIENCE:-}"
      OIDC_JWKS_URL: "${OIDC_JWKS_URL:-}"
      OIDC_ALLOWED_ALGORITHMS: "${OIDC_ALLOWED_ALGORITHMS:-}"
      KURUAUTH_ISSUER: "${KURUAUTH_ISSUER:-}"
      KURUAUTH_AUDIENCE: "${KURUAUTH_AUDIENCE:-}"
      KURUAUTH_JWKS_URL: "${KURUAUTH_JWKS_URL:-}"
      KURUAUTH_ALLOWED_ALGORITHMS: "${KURUAUTH_ALLOWED_ALGORITHMS:-}"
      CLOUDFLARE_ACCESS_REQUIRED: "${CLOUDFLARE_ACCESS_REQUIRED:-}"
      CLOUDFLARE_ACCESS_TEAM_DOMAIN: "${CLOUDFLARE_ACCESS_TEAM_DOMAIN:-}"
      CLOUDFLARE_ACCESS_AUDIENCE: "${CLOUDFLARE_ACCESS_AUDIENCE:-}"
      LOCAL_JWT_ISSUER: "${LOCAL_JWT_ISSUER:-}"
      LOCAL_JWT_AUDIENCE: "${LOCAL_JWT_AUDIENCE:-}"
      LOCAL_JWT_SECRET: "${LOCAL_JWT_SECRET:-}"
      RATE_LIMIT_MAX: "${RATE_LIMIT_MAX:-120}"
      RATE_LIMIT_WINDOW: "${RATE_LIMIT_WINDOW:-1 minute}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
      - edge
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  cloudflared:
    image: cloudflare/cloudflared:2026.8.0
    restart: unless-stopped
    profiles:
      - tunnel
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN}"]
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    read_only: true
    security_opt:
      - no-new-privileges:true

networks:
  private:
    internal: true
  edge:

volumes:
  postgres-data:
